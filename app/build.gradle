apply plugin: 'com.android.application'
def applicationName = "ComittoNxA"
def versionMajor = 2
def versionMinor = 0
def versionPatch = 4
def revision = "A"

android {
    namespace 'jp.dip.muracoro.comittona'
    compileSdkVersion 33
    buildToolsVersion '33.0.2'
    defaultConfig {
        applicationId "jp.dip.muracoro.comittona"
        minSdkVersion 30
        targetSdkVersion 33  // 30にしたらページ選択のサムネイルが動かなかった
        versionCode versionMajor * 10000 + versionMinor * 100 + versionPatch
        versionName String.format("%d.%02d%s%02d", versionMajor, versionMinor, revision, versionPatch)
        ndk {
            //abiFilters "arm64-v8a",  "x86_64"    // ARM 64bit と x86 64bit でC++をメイクする
            abiFilters "arm64-v8a" // ARM 64bitのみでC++をメイクする
        }
    }
    applicationVariants.all { variant ->
        if (variant.buildType.name != "release") {
            return
        }
        variant.outputs.all {
            outputFileName = "${applicationName}_${versionName}.apk"
        }
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            jniDebuggable true
            renderscriptDebuggable true
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }
    productFlavors {
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // SDカード書き込み用 AndroidX DocumentFile
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // SVGファイル(アイコン表示用)
    implementation 'com.caverock:androidsvg-aar:1.4'
    // PDF
    //implementation 'com.joanzapata.pdfview:android-pdfview:1.0.+@aar'
    // 圧縮ファイル
    //implementation 'org.apache.commons:commons-compress:1.20'
    //implementation 'org.tukaani:xz:1.8'
    // 画像
    //implementation 'com.github.bumptech.glide:glide:3.6.1'

    // SMB2/3接続用ライブラリ
    implementation 'com.hierynomus:smbj:0.10.0'         // smbj SMB2ライブラリ
    implementation 'com.rapid7.client:dcerpc:0.10.0'    // smbj SMB2 RPCライブラリ
}
